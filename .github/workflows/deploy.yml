name: Deploy static content to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 优化：收紧了 contents 权限
permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Update Algolia Index
        if: github.actor != 'nektos/act'
        env:
          HEXO_ALGOLIA_INDEXING_KEY: ${{ secrets.HEXO_ALGOLIA_INDEXING_KEY }}
        run: npm run algolia

      - name: Baidu URL submit
        # 主动向百度站长平台推送最新文章（token 由 secrets 注入）
        # 推送失败不阻断部署
        if: github.actor != 'nektos/act'
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: npx hexo baidu-submit || echo "Baidu push failed (non-blocking)"

      - name: Upload GitHub Pages artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/master' && github.actor != 'nektos/act'
        uses: actions/deploy-pages@v5