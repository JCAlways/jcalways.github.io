# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: JCAlways
subtitle: "前端开发与编程技术笔记 | 张思帆的博客"
description: "JCAlways 个人技术博客，分享前端开发（Vue、React、TypeScript、Node.js、JavaScript）过程中遇到的问题与解决方案，以及后端、工具类技术文章。"
keywords: "博客,Blog,个人博客,张思帆,zhangsifan,zhangsifan.com,blog.zhangsifan.com,JCAlways,Always-Team,前端,前端技术,前端知识分享,前端技术分享"
author: JCAlways
language: zh-CN
timezone: "Asia/Shanghai"

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.zhangsifan.com
permalink: /posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
## 使用 'date' 而非 'mtime'：CI 部署时 checkout 会重置文件 mtime，
## 避免无 updated 字段的文章被搜索引擎误判为频繁更新
updated_option: "date"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repository: git@github.com:JCAlways/jcalways.github.io.git
  branch: master

# Sitemap
## https://github.com/hexojs/hexo-generator-sitemap
## tags/categories 聚合页内容单薄，不收录进 sitemap，避免浪费抓取配额
## 自定义模板排除 manifest.json 等非内容文件
sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  template: sitemap_template.xml
  template_txt: sitemap_template.txt
  rel: true
  tags: false
  categories: false

# 百度主动推送
## https://github.com/huiwang/hexo-baidu-url-submit
## token 通过环境变量 BAIDU_TOKEN 注入（见 scripts/baidu-url-submit.js），
## 由 CI secrets 提供，避免明文提交到仓库
baidu_url_submit:
  count: 10 # 百度普通收录每日配额有限，提交最近 10 篇
  host: blog.zhangsifan.com # 百度站长平台已验证域名
  token: "" # 勿在此填写，用环境变量 BAIDU_TOKEN 注入
  path: baidu_urls.txt # 生成的 URL 列表文件（不含 token）

algolia:
  applicationID: "YQUJUB5NGV"
  apiKey: "501be01d4df300779328014a1a5ba292"
  chunkSize: 5000
  indexName: "my-hexo-blog"

douban:
